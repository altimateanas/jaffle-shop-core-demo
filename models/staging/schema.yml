version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        description: Unique identifier for a customer.
        tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name. PII.
      - name: last_name
        description: Customer's last name. PII.

  - name: stg_orders
    columns:
      - name: order_id
        description: Unique identifier for an order.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to the customer who placed the order.
      - name: order_date
        description: Date that the order was placed.
      - name: status
        description: Current order status.
        tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

  - name: stg_payments
    columns:
      - name: payment_id
        description: Unique identifier for a payment.
        tests:
          - unique
          - not_null
      - name: order_id
        description: Foreign key to the order associated with the payment.
      - name: payment_method
        description: Method used to make the payment.
        tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'coupon', 'bank_transfer', 'gift_card']
      - name: amount
        description: Payment amount in dollars.
